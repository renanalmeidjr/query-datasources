quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USERNAME:sa}
quarkus.datasource.password=${DB_PASSWORD:change_me}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=keycloak_test;encrypt=true;trustServerCertificate=true;hostNameInCertificate=*.database.windows.net;loginTimeout=30;socketTimeout=30000;}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:50}
quarkus.datasource.jdbc.initial-size=${DB_POOL_INITIAL_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_POOL_ACQUIRE_TIMEOUT:30S}
quarkus.datasource.jdbc.background-validation-interval=30S
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

quarkus.http.host=0.0.0.0
quarkus.http.port=${HTTP_PORT:8080}

quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

harness.cache-sync.enabled=${CACHE_SYNC_ENABLED:false}
harness.cache-sync.interval-ms=${CACHE_SYNC_INTERVAL_MS:100}
harness.cache-sync.session-id=${CACHE_SYNC_SESSION_ID:session-000001}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:workload;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=${DB_PASSWORD:change_me}